version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: sam-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '127.0.0.1:27018:27017'
    environment:
      MONGO_INITDB_DATABASE: smart_academic_manager
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  mongo_data:
    driver: local
